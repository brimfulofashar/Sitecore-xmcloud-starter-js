      Value: "<p><em>By Mike Raposa, Chief Revenue Officer, Williams Lea</em></p><h2>Big Law is breaking profit records again. But for how long?</h2><p>Firms are spending more to run the business, carrying more unbilled work and waiting longer to get paid. AI is supposed to help with all three. So far, the returns are hard to find.</p><h2>Who owns the work that crosses departments</h2><p>Law firms have always been organized by department. That works until the deliverable crosses all of them—and real AI workflows do. Each department owns its piece of that chain, and the gains from AI stall at every handoff where ownership stops.</p><p><a href=\"https://www.williamslea.com/blog/who-owns-the-work-when-ai-crosses-every-department/\">Read the full article on williamslea.com</a></p>"
