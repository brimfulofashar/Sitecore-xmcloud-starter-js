<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Source for the Williams Lea site template tile. Render with:
     msedge --headless=new --hide-scrollbars --window-size=1170,1000 --screenshot=thumbnail.png site-template-thumbnail.html -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1170px; height: 1000px; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; background: #0a1f3d; }
  header { height: 120px; background: #fff; display: flex; align-items: center; padding: 0 56px; gap: 44px; }
  .logo { color: #004e97; font-size: 40px; font-weight: 600; letter-spacing: -0.5px; margin-right: auto; }
  nav { display: flex; gap: 34px; color: #333d47; font-size: 22px; }
  .cta { background: #004e97; color: #fff; font-size: 22px; padding: 14px 28px; border-radius: 999px; }
  .hero { position: relative; height: 880px; background: linear-gradient(135deg, #0a1f3d 0%, #004e97 55%, #5b2a86 100%); overflow: hidden;
          display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 90px; gap: 34px; }
  svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 75%; opacity: .4; }
  .eyebrow { color: #ff9e25; font-style: italic; font-size: 30px; position: relative; }
  h1 { color: #fff; font-weight: 300; font-size: 64px; line-height: 1.15; position: relative; }
  .btn { position: relative; border: 2px solid #fff; color: #fff; font-size: 24px; padding: 16px 34px; border-radius: 999px; }
</style>
</head>
<body>
  <header>
    <div class="logo">williams lea</div>
    <nav><span>Services</span><span>Outcomes</span><span>Industries</span><span>Insights</span></nav>
    <div class="cta">Contact Us</div>
  </header>
  <section class="hero">
    <svg viewBox="0 0 1440 400" preserveAspectRatio="none" id="waves"></svg>
    <div class="eyebrow">Transforming Business. Together.</div>
    <h1>AI-enabled, expert-led Business and Marketing Services for superior business outcomes</h1>
    <div class="btn">Learn more &rarr;</div>
  </section>
  <script>
    const svg = document.getElementById('waves');
    for (let i = 0; i < 22; i++) {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', `M0 ${260 + i * 6} C 360 ${120 + i * 10}, 720 ${380 - i * 4}, 1080 ${200 + i * 8} S 1440 ${240 + i * 5}, 1440 ${240 + i * 5}`);
      p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'white'); p.setAttribute('stroke-width', '1');
      svg.appendChild(p);
    }
  </script>
</body>
</html>
